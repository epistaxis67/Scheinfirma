<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logo-Varianten</title>
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<style>
  :root { --bg:#07070a; --panel:#111118; --line:#26263a; --txt:#e8e6ef; --dim:#8a879a; --red:#ff3b30; --cyan:#00e5ff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:14px/1.5 "JetBrains Mono", ui-monospace, monospace; }
  header { padding:28px 24px 8px; max-width:1500px; margin:0 auto; }
  h1 { font-size:18px; letter-spacing:.2em; margin:0 0 4px; }
  h1 span { color:var(--red); }
  .sub { color:var(--dim); font-size:12px; letter-spacing:.06em; max-width:760px; }
  .ctrl { display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:16px 24px; max-width:1500px; margin:0 auto; position:sticky; top:0; background:rgba(7,7,10,.92); backdrop-filter:blur(6px); z-index:5; border-bottom:1px solid var(--line); }
  button { font:inherit; font-size:12px; letter-spacing:.08em; background:var(--panel); color:var(--txt); border:1px solid var(--line); padding:8px 12px; cursor:pointer; }
  button.on { border-color:var(--red); color:var(--red); }
  input[type=range] { width:min(380px,60vw); accent-color:var(--red); }
  .tc { color:var(--dim); font-size:12px; min-width:110px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(var(--cw),1fr)); gap:22px; padding:22px 24px 60px; max-width:1500px; margin:0 auto; }
  body.f916 { --cw:270px; } body.f169 { --cw:420px; }
  .card { background:var(--panel); border:1px solid var(--line); padding:12px; }
  canvas { display:block; width:100%; height:auto; background:#000; }
  .name { margin:12px 0 2px; font-weight:700; letter-spacing:.14em; }
  .name b { color:var(--red); margin-right:8px; }
  .bar { position:relative; display:flex; height:16px; margin:8px 0 10px; font-size:9px; letter-spacing:.1em; color:#000; }
  .bar i { font-style:normal; display:flex; align-items:center; justify-content:center; }
  .bar .a { background:var(--red); } .bar .b { background:#3a3a52; color:var(--dim); } .bar .c { background:var(--cyan); }
  .bar .ph { position:absolute; top:-3px; bottom:-3px; width:2px; background:#fff; box-shadow:0 0 6px #fff; }
  .card p { margin:4px 0; font-size:12px; color:var(--dim); }
  .card p em { font-style:normal; color:var(--txt); }
</style>
</head>
<body class="f916">
<header>
  <h1>SCHEINFIRMA <span>//</span> LOGO IN BEWEGUNG</h1>
  <div class="sub">Fünf Entwürfe, wie das Logo einen Clip eröffnet und beendet. Alle laufen synchron: rot = Anfang, grau = dein Clip (Platzhalter), türkis = Ende. Noch keine fertigen Dateien, nur zum Vergleichen.</div>
</header>
<div class="ctrl">
  <button id="f916" class="on">9:16 HOCHFORMAT</button>
  <button id="f169">16:9 QUERFORMAT</button>
  <button id="play">❚❚ PAUSE</button>
  <button id="slow">TEMPO 1×</button>
  <input id="scrub" type="range" min="0" max="7" step="0.01" value="0">
  <span class="tc" id="tc">0.00 s</span>
</div>
<div class="grid" id="grid"></div>

<script>
const T = 7, I1 = 1.8, O0 = 5.2;           // Anfang 0–1.8 s · Clip · Ende 5.2–7 s
const LA = 532 / 410;                     // Seitenverhältnis Logo
const RED = "#ff3b30", CYAN = "#00e5ff";
const R = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, p) => a + (b - a) * p;
const easeOut = p => 1 - Math.pow(1 - p, 3);
const easeIn = p => p * p * p;
const easeIO = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const seg = (t, a, b) => clamp((t - a) / (b - a));

const svg = new Image();
let L = {};                                 // eingefärbte Logos
function tint(col) {
  const c = document.createElement("canvas"); c.width = 1600; c.height = Math.round(1600 / LA);
  const x = c.getContext("2d"); x.drawImage(svg, 0, 0, c.width, c.height);
  x.globalCompositeOperation = "source-in"; x.fillStyle = col; x.fillRect(0, 0, c.width, c.height);
  return c;
}

/* ── Zeichenhilfen ─────────────────────────────── */
function logo(x, src, cx, cy, w, a = 1) {
  const h = w / LA; x.globalAlpha = a; x.drawImage(src, cx - w / 2, cy - h / 2, w, h); x.globalAlpha = 1;
}
function slice(x, src, cx, cy, w, y0, y1, dx = 0, dy = 0, a = 1) {
  const h = w / LA; x.globalAlpha = a;
  x.drawImage(src, 0, y0 * src.height, src.width, (y1 - y0) * src.height, cx - w / 2 + dx, cy - h / 2 + y0 * h + dy, w, (y1 - y0) * h);
  x.globalAlpha = 1;
}
function glitch(x, cx, cy, w, amt, seed) {
  logo(x, L.w, cx, cy, w);
  if (amt <= 0) return;
  x.globalCompositeOperation = "screen";
  for (let k = 0; k < 4; k++) {
    if (R(seed + k * 7) > amt) continue;
    const y0 = R(seed + k * 3) * .8, y1 = y0 + .05 + R(seed + k * 5) * .25;
    const dx = (R(seed + k * 11) - .5) * .08 * w * (1 + amt);
    slice(x, k % 2 ? L.c : L.r, cx, cy, w, y0, Math.min(1, y1), dx, (R(seed + k) - .5) * .02 * w, .9);
  }
  x.globalCompositeOperation = "source-over";
  if (amt > .5) {                            // verschobene weiße Scheibe
    const y0 = R(seed * 3.3) * .8;
    x.fillStyle = "#000"; const h = w / LA;
    x.fillRect(cx - w / 2 - 4, cy - h / 2 + y0 * h, w + 8, .06 * h);
    slice(x, L.w, cx, cy, w, y0, y0 + .06, (R(seed * 1.7) - .5) * .15 * w);
  }
}
function black(x, W, H, a = 1) { x.globalAlpha = a; x.fillStyle = "#000"; x.fillRect(0, 0, W, H); x.globalAlpha = 1; }

/* ── Platzhalter-Clip ─────────────────────────── */
function drawClip(x, W, H, t) {
  const g = x.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#14223f"); g.addColorStop(.65, "#3b1f45"); g.addColorStop(1, "#0b0b14");
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  const m = Math.min(W, H);
  const sg = x.createRadialGradient(W * .68, H * .38, 0, W * .68, H * .38, m * .35);
  sg.addColorStop(0, "rgba(255,90,60,.85)"); sg.addColorStop(.35, "rgba(215,80,150,.35)"); sg.addColorStop(1, "rgba(0,0,0,0)");
  x.fillStyle = sg; x.fillRect(0, 0, W, H);
  for (let layer = 0; layer < 2; layer++) {
    const sp = layer ? 26 : 12, col = layer ? "#07070d" : "#1a1630", base = H * (layer ? .78 : .7);
    for (let i = 0; i < 18; i++) {
      const bw = m * (.06 + R(i + layer * 50) * .1), bh = H * (.12 + R(i * 3 + layer) * (layer ? .35 : .25));
      const span = W + m * .6;
      const px = ((i * span / 18 + t * sp * (m / 300)) % span) - m * .3;
      x.fillStyle = col; x.fillRect(px, base - bh, bw, bh + H);
      if (layer) { x.fillStyle = i % 3 ? "rgba(0,229,255,.55)" : "rgba(255,59,48,.6)"; x.fillRect(px + bw * .3, base - bh * .8, bw * .12, bh * .5); }
    }
  }
  x.fillStyle = "rgba(255,255,255,.55)"; x.font = `700 ${Math.round(m * .06)}px JetBrains Mono, monospace`;
  x.textAlign = "center"; x.fillText("DEIN CLIP", W / 2, H * .9);
  x.font = `${Math.round(m * .035)}px JetBrains Mono, monospace`; x.fillStyle = "rgba(255,255,255,.4)";
  const f = Math.floor(t * 25); x.fillText(`REC 00:00:${String(Math.floor(t)).padStart(2, "0")}:${String(f % 25).padStart(2, "0")}`, W / 2, H * .95);
}

/* ── Varianten ────────────────────────────────── */
const V = [
{ name: "GLITCH-SCHNITT",
  a: "Logo flackert aus dem Schwarz auf, zerreißt in Farbstreifen und springt als kleines Zeichen in die Ecke.",
  e: "Das Zeichen springt zurück in die Mitte, das Bild zerfällt, harter Schnitt auf Schwarz.",
  k: "Am nächsten an der Website. Kurz, hart, rhythmisch.",
  draw(x, s) {
    const { W, H, t, clip, big, bug } = s, cx = W / 2, cy = H / 2, sd = Math.floor(t * 24);
    if (t < I1) {
      black(x, W, H);
      if (t < .3) { if (R(sd) > .45) glitch(x, cx, cy, big, 1, sd); return; }
      if (t < 1.2) { glitch(x, cx, cy, big, 1 - seg(t, .3, 1.2) * .8, sd); return; }
      const p = easeIO(seg(t, 1.2, I1));
      x.drawImage(clip, 0, 0);
      const n = 12; x.fillStyle = "#000";
      for (let i = 0; i < n; i++) if (R(i + sd * 13) > p) x.fillRect(0, i * H / n, W, H / n + 1);
      glitch(x, lerp(cx, bug.x, p), lerp(cy, bug.y, p), lerp(big, bug.w, p), .5 * (1 - p), sd);
      return;
    }
    if (t < O0) { x.drawImage(clip, 0, 0); glitch(x, bug.x, bug.y, bug.w, (t % 1.6) > 1.45 ? .8 : 0, sd); return; }
    const q = seg(t, O0, T);
    if (q < .35) {
      const p = easeIO(q / .35);
      x.drawImage(clip, 0, 0); black(x, W, H, p * .75);
      glitch(x, lerp(bug.x, cx, p), lerp(bug.y, cy, p), lerp(bug.w, big, p), .4, sd);
    } else if (q < .75) {
      black(x, W, H);
      const n = 10; for (let i = 0; i < n; i++) if (R(i + sd * 7) > .7) x.drawImage(clip, 0, i * H / n, W, H / n, (R(i + sd) - .5) * W * .2, i * H / n, W, H / n);
      glitch(x, cx, cy, big, 1, sd);
    } else {
      black(x, W, H);
      const p = seg(q, .75, 1), n = 8;
      for (let i = 0; i < n; i++) if (R(i * 5 + sd) > p * 1.1) slice(x, L.w, cx, cy, big, i / n, (i + 1) / n, (R(i + sd) - .5) * big * p * .8, 0, 1 - p);
    }
  } },

{ name: "SCAN",
  a: "Das Logo zieht riesig wie ein Laufband durchs Bild. Hinter ihm erscheint der Clip, eine rote Scan-Linie markiert die Kante.",
  e: "Das Logo kommt von der anderen Seite zurück, wischt den Clip weg und bleibt als Endbild in der Mitte stehen.",
  k: "Viel Bewegung über die ganze Breite, gut für Hochformat.",
  draw(x, s) {
    const { W, H, t, clip, big, bug } = s, lh = H * .55, lw = lh * LA;
    const scan = (sx, dir) => {
      const g = x.createLinearGradient(sx - dir * 30, 0, sx, 0);
      g.addColorStop(0, "rgba(255,59,48,0)"); g.addColorStop(1, "rgba(255,59,48,.8)");
      x.fillStyle = g; x.fillRect(Math.min(sx, sx - dir * 30), 0, 30, H);
      x.fillStyle = "#fff"; x.fillRect(sx - 1, 0, 2, H);
    };
    const trail = (cx, cy, v) => { x.globalCompositeOperation = "screen";
      for (let k = 3; k > 0; k--) logo(x, k % 2 ? L.r : L.c, cx - v * k * .05, cy, lw, .25 / k);
      x.globalCompositeOperation = "source-over"; logo(x, L.w, cx, cy, lw); };
    if (t < I1) {
      black(x, W, H);
      const p = easeIO(seg(t, 0, 1.45)), cx = lerp(W + lw / 2, -lw / 2, p), edge = cx + lw / 2;
      if (edge < W) { x.drawImage(clip, edge, 0, W - edge, H, edge, 0, W - edge, H); scan(edge, -1); }
      if (p < 1) trail(cx, H / 2, -(W + lw) * 1.2);
      const b = easeOut(seg(t, 1.4, I1));
      if (b > 0) logo(x, L.w, lerp(-bug.w, bug.x, b), bug.y, bug.w);
      return;
    }
    if (t < O0) { x.drawImage(clip, 0, 0); logo(x, L.w, bug.x, bug.y, bug.w); return; }
    const q = seg(t, O0, T);
    x.drawImage(clip, 0, 0);
    logo(x, L.w, lerp(bug.x, -bug.w, easeIn(seg(q, 0, .2))), bug.y, bug.w);
    const p = easeOut(seg(q, .15, .8)), cx = lerp(-lw / 2, W / 2, p), edge = cx - lw / 2;
    black(x, W, H, 0); x.fillStyle = "#000"; x.fillRect(0, 0, Math.max(0, edge), H);
    if (edge > 0 && q < .82) scan(edge, 1);
    const fit = lerp(lw, big, easeIO(seg(q, .7, 1)));
    if (q > .8) black(x, W, H);
    if (q > .15) { if (p < 1) trail(cx, H / 2, (W / 2 + lw / 2) * 1.2); else logo(x, L.w, cx, H / 2, fit); }
    if (q > .8) logo(x, L.w, W / 2, H / 2, fit);
  } },

{ name: "GEISTERSPUR",
  a: "Das Logo schwebt mit roten und türkisen Nachbildern ins Bild, hält kurz, zerfällt in drei Geister, die den Clip freigeben.",
  e: "Die drei Geister finden wieder zusammen, das Logo verlässt das Bild schräg nach oben und zieht seine Spur hinter sich her.",
  k: "Weicher, unheimlicher. Passt zum Namen 幽霊会社 (Geisterfirma).",
  draw(x, s) {
    const { W, H, t, clip, big, bug } = s, cx = W / 2, cy = H / 2;
    const pathIn = u => [lerp(-W * .4, cx, easeOut(clamp(u))), lerp(H * 1.15, cy, easeOut(clamp(u)))];
    const pathOut = u => [lerp(cx, W * 1.4, easeIn(clamp(u))), lerp(cy, -H * .35, easeIn(clamp(u)))];
    const ghosts = (fn, u, step) => { x.globalCompositeOperation = "screen";
      for (let k = 7; k > 0; k--) { const [gx, gy] = fn(u - k * step); logo(x, k % 2 ? L.r : L.c, gx, gy, big, .5 * (1 - k / 8)); }
      x.globalCompositeOperation = "source-over"; const [px, py] = fn(u); logo(x, L.w, px, py, big); };
    if (t < I1) {
      if (t < 1.3) { black(x, W, H); ghosts(pathIn, t / 1.0, .045); return; }
      const p = easeOut(seg(t, 1.3, I1));
      x.drawImage(clip, 0, 0); black(x, W, H, 1 - p);
      x.globalCompositeOperation = "screen";
      logo(x, L.r, cx - p * big * .5, cy - p * big * .1, big * (1 + p * .6), 1 - p);
      logo(x, L.c, cx + p * big * .5, cy + p * big * .1, big * (1 + p * .6), 1 - p);
      x.globalCompositeOperation = "source-over";
      logo(x, L.w, cx, cy, big * (1 + p * .3), 1 - p);
      logo(x, L.w, bug.x, bug.y, bug.w, p);
      return;
    }
    if (t < O0) { x.drawImage(clip, 0, 0); logo(x, L.w, bug.x, bug.y, bug.w, .85 + .15 * Math.sin(t * 3)); return; }
    const q = seg(t, O0, T);
    if (q < .4) {
      const p = easeIO(q / .4);
      x.drawImage(clip, 0, 0); black(x, W, H, p * .85);
      logo(x, L.w, bug.x, bug.y, bug.w, 1 - p);
      x.globalCompositeOperation = "screen";
      logo(x, L.r, cx - (1 - p) * big * .5, cy, big * (1.6 - p * .6), p);
      logo(x, L.c, cx + (1 - p) * big * .5, cy, big * (1.6 - p * .6), p);
      x.globalCompositeOperation = "source-over";
      logo(x, L.w, cx, cy, big, p);
      return;
    }
    black(x, W, H); x.globalAlpha = .15 * (1 - seg(q, .4, .6)); x.drawImage(clip, 0, 0); x.globalAlpha = 1;
    ghosts(pathOut, seg(q, .45, 1), .05);
  } },

{ name: "LAMELLEN",
  a: "Das Logo ist in Streifen geschnitten, die abwechselnd von links und rechts einfahren. Danach fahren sie weiter und öffnen den Clip wie eine Jalousie.",
  e: "Schwarze Streifen schließen den Clip, die Logo-Streifen fahren ein und setzen sich zum Endbild zusammen.",
  k: "Grafisch, präzise. Wirkt wie ein Vorhang.",
  draw(x, s) {
    const { W, H, t, clip, big, bug } = s, cx = W / 2, cy = H / 2, N = 9, off = W + big;
    const strips = (fn) => { for (let i = 0; i < N; i++) { const d = i % 2 ? 1 : -1; slice(x, L.w, cx, cy, big, i / N, (i + 1) / N + .002, d * fn(i)); } };
    if (t < I1) {
      black(x, W, H);
      if (t < 1.2) { strips(i => off * (1 - easeOut(seg(t, i * .05, .7 + i * .05)))); return; }
      const bands = 9;
      for (let i = 0; i < bands; i++) {
        const p = easeIO(seg(t, 1.2 + i * .025, 1.6 + i * .025)), d = i % 2 ? 1 : -1, bh = H / bands;
        const w = W * p, sx = d > 0 ? W - w : 0;
        if (w > 0) x.drawImage(clip, sx, i * bh, w, bh + 1, sx, i * bh, w, bh + 1);
      }
      strips(i => -off * easeIn(seg(t, 1.2 + i * .03, 1.65 + i * .03)));
      const b = seg(t, 1.6, I1); if (b > 0) logo(x, L.w, bug.x, bug.y, bug.w, b);
      return;
    }
    if (t < O0) { x.drawImage(clip, 0, 0); logo(x, L.w, bug.x, bug.y, bug.w); return; }
    const q = seg(t, O0, T);
    x.drawImage(clip, 0, 0); logo(x, L.w, bug.x, bug.y, bug.w, 1 - seg(q, 0, .15));
    const bands = 9;
    for (let i = 0; i < bands; i++) {
      const p = easeIO(seg(q, i * .02, .4 + i * .02)), d = i % 2 ? -1 : 1, bh = H / bands, w = W * p;
      x.fillStyle = "#000"; x.fillRect(d > 0 ? 0 : W - w, i * bh, w, bh + 1);
    }
    if (q > .3) strips(i => -off * (1 - easeOut(seg(q, .3 + i * .03, .8 + i * .03))));
  } },

{ name: "DURCHFLUG",
  a: "Der Clip erscheint zuerst nur innerhalb der Buchstaben. Dann fliegt die Kamera durch das E hindurch, bis der Clip das ganze Bild füllt.",
  e: "Rückwärts: Die Kamera fliegt aus dem E heraus, der Clip schrumpft in die Buchstaben, das Logo wird wieder weiß.",
  k: "Das Logo als Fenster in den Film. Ohne Zeichen in der Ecke.",
  draw(x, s) {
    const { W, H, t, clip, big, m } = s, cx = W / 2, cy = H / 2;
    const FX = .595, FY = .58;                 // Punkt im Stamm des E
    const framed = (w, a) => {                 // Clip nur in den Buchstaben
      const h = w / LA, px = lerp(cx, cx - (FX - .5) * w, 1), py = cy - (FY - .5) * h;
      const p = clamp((w - big) / (big * 3));   // Fokuspunkt wandert zur Mitte
      const lx = lerp(cx, px, p), ly = lerp(cy, py, p);
      const mx = m.getContext("2d"); mx.globalCompositeOperation = "source-over";
      mx.clearRect(0, 0, W, H); mx.drawImage(clip, 0, 0);
      mx.globalCompositeOperation = "destination-in"; mx.drawImage(svg, lx - w / 2, ly - h / 2, w, h);
      black(x, W, H); logo(x, L.w, lx, ly, w, 1 - a); x.globalAlpha = a; x.drawImage(m, 0, 0); x.globalAlpha = 1;
    };
    const zoom = p => big * Math.pow(120, p);
    if (t < I1) {
      if (t < .5) { black(x, W, H); glitch(x, cx, cy, big, R(Math.floor(t * 24)) > .6 ? .8 : 0, Math.floor(t * 24)); return; }
      if (t < .9) { framed(big, seg(t, .5, .9)); return; }
      const p = easeIn(seg(t, .9, 1.7));
      if (p >= 1) { x.drawImage(clip, 0, 0); return; }
      framed(zoom(p), 1); return;
    }
    if (t < O0) { x.drawImage(clip, 0, 0); return; }
    const q = seg(t, O0, T);
    if (q < .55) { const p = 1 - easeOut(q / .55); if (p > .995) { x.drawImage(clip, 0, 0); return; } framed(zoom(p), 1); return; }
    if (q < .8) { framed(big, 1 - seg(q, .55, .8)); return; }
    black(x, W, H); logo(x, L.w, cx, cy, big, 1 - seg(q, .92, 1) * .0);
  } }
];

/* ── Aufbau ───────────────────────────────────── */
let fmt = "916", t = 0, playing = true, speed = 1, last = performance.now();
const grid = document.getElementById("grid"), cards = [];
function size() { return fmt === "916" ? [270, 480] : [480, 270]; }
function build() {
  grid.innerHTML = ""; cards.length = 0;
  const [cw, ch] = size(), dpr = Math.min(2, window.devicePixelRatio || 1), W = cw * dpr, H = ch * dpr;
  V.forEach((v, i) => {
    const el = document.createElement("div"); el.className = "card";
    el.innerHTML = `<canvas width="${W}" height="${H}"></canvas>
      <div class="name"><b>V${i + 1}</b>${v.name}</div>
      <div class="bar"><i class="a" style="width:${I1 / T * 100}%">ANFANG</i><i class="b" style="width:${(O0 - I1) / T * 100}%">CLIP</i><i class="c" style="width:${(T - O0) / T * 100}%">ENDE</i><span class="ph"></span></div>
      <p><em>Anfang:</em> ${v.a}</p><p><em>Ende:</em> ${v.e}</p><p>${v.k}</p>`;
    grid.appendChild(el);
    const clip = document.createElement("canvas"); clip.width = W; clip.height = H;
    const m = document.createElement("canvas"); m.width = W; m.height = H;
    cards.push({ v, x: el.querySelector("canvas").getContext("2d"), ph: el.querySelector(".ph"), clip, m, W, H });
  });
}
function frame(now) {
